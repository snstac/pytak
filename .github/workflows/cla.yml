name: CLA Check\n\non:\n  pull_request_target:\n  issue_comment:\n    types: [created]\n\njobs:\n  cla-check:\n    runs-on: ubuntu-latest\n    permissions:\n      actions: write\n      contents: write\n      pull-requests: write\n      statuses: write\n    steps:\n      - uses: actions/checkout@v4\n      - name: Run CLA Check\n        uses: contributor-assistant/github-action@v2\n        env:\n          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }\n        with:\n          path-to-signatures: signatures/version1/cla.json\n          path-to-document: https://github.com/snstac/pytak/blob/main/CLA.md\n          branch: main\n          allowlist: ampledata,btannerbot,dependabot[bot],github-actions[bot]\n          remote-organization-name: snstac\n          remote-repository-name: cla-signatures\n